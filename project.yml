name: LayerKeys
options:
  createIntermediateGroups: true
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  LayerKeys:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LayerKeys
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.taylorfinklea.layerkeys
        PRODUCT_NAME: LayerKeys
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LayerKeys/Info.plist
        CODE_SIGN_STYLE: Automatic
    info:
      path: LayerKeys/Info.plist
      properties:
        CFBundleDisplayName: LayerKeys
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        # Sparkle auto-update keys. SUPublicEDKey is a placeholder until M4a Phase C
        # generates the real EdDSA keypair via Sparkle's `generate_keys`. Sparkle
        # refuses unverifiable updates, so leaving the placeholder here is safe.
        SUPublicEDKey: "REPLACE_AT_PHASE_C_WITH_REAL_EDDSA_PUBLIC_KEY"
        SUFeedURL: "https://github.com/TaylorFinklea/layerkeys/releases/latest/download/appcast.xml"
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    scheme:
      gatherCoverageData: false
      testTargets:
        - LayerKeysTests
  LayerKeysTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LayerKeysTests
    dependencies:
      - target: LayerKeys
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      gatherCoverageData: false
