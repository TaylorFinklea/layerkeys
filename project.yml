name: LayerKeys
options:
  createIntermediateGroups: true
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 0.2.6
    CURRENT_PROJECT_VERSION: 8
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  LayerKeys:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LayerKeys
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.taylorfinklea.layerkeys
        PRODUCT_NAME: LayerKeys
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LayerKeys/Info.plist
        CODE_SIGN_STYLE: Automatic
    info:
      path: LayerKeys/Info.plist
      properties:
        CFBundleDisplayName: LayerKeys
        CFBundleShortVersionString: "0.2.6"
        CFBundleVersion: "8"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        # Sparkle auto-update keys. The matching EdDSA private key is stored in the
        # release-builder's macOS keychain (added by Sparkle's `generate_keys`). For
        # CI, the private key is fed to `generate_appcast` via the
        # `SPARKLE_EDDSA_PRIVATE_KEY` GitHub secret.
        SUPublicEDKey: "l2ghc9Y6kQcCddTEo6oRIJ2KL3rrE1ji/Xz+i9bme70="
        SUFeedURL: "https://github.com/TaylorFinklea/layerkeys/releases/latest/download/appcast.xml"
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    scheme:
      gatherCoverageData: false
      testTargets:
        - LayerKeysTests
  LayerKeysTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LayerKeysTests
    dependencies:
      - target: LayerKeys
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      gatherCoverageData: false
