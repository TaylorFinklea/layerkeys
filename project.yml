name: LayerKeys
options:
  createIntermediateGroups: true
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  LayerKeys:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LayerKeys
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.taylorfinklea.layerkeys
        PRODUCT_NAME: LayerKeys
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LayerKeys/Info.plist
        CODE_SIGN_STYLE: Automatic
    info:
      path: LayerKeys/Info.plist
      properties:
        CFBundleDisplayName: LayerKeys
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
    scheme:
      gatherCoverageData: false
      testTargets:
        - LayerKeysTests
  LayerKeysTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LayerKeysTests
    dependencies:
      - target: LayerKeys
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      gatherCoverageData: false
